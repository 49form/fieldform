[package]
name = "fieldform-import"
version = "0.1.0"
edition.workspace = true
license = "GPL-3.0-only"
authors = ["49form"]
repository = "https://github.com/49form/fieldform"
publish = false

# Deliberately only `fieldform-io`. This is the binary that carries OpenCASCADE, and the whole
# point of it existing is that nothing else has to — so it must not grow a dependency on the
# application, and the application must not grow one on it.
[dependencies]
fieldform-io = { workspace = true, features = ["step"] }
