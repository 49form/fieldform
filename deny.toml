# Licence policy, per layer. See LICENSE for which crate is in which layer.
#
# cargo-deny has one global allow-list, so this is the union the *application* layer may use, and
# the stricter kernel rule is enforced in two places: `[[licenses.exceptions]]` names the only
# crates allowed a weak-copyleft licence, and CI asserts with `cargo tree` that no kernel crate
# reaches them except through the optional `step` feature.
#
# Kernel crates (MPL-2.0): permissive licences only.
# Application crates (GPL-3.0-only): additionally the fonts' OFL/Ubuntu licences.

[graph]
all-features = false

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "Unicode-3.0", "BSL-1.0", "CC0-1.0", "Unlicense", "0BSD", "MPL-2.0",
    # Application layer only (egui's bundled fonts).
    "OFL-1.1", "Ubuntu-font-1.0",
]
exceptions = [
    # OpenCASCADE bindings: LGPL-2.1, reached only through the `step` feature / the importer process.
    { allow = ["LGPL-2.1"], crate = "opencascade" },
    { allow = ["LGPL-2.1"], crate = "opencascade-sys" },
    { allow = ["LGPL-2.1"], crate = "occt-sys" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
# Only unmaintained crates the workspace itself names directly are errors; the transitive ones
# (windowing and font stacks) are not ours to replace.
unmaintained = "workspace"
ignore = [
    # `zip` is read with `ZipArchive::new` and entry readers only; nothing calls `extract()`, which
    # is the code all three advisories describe. Upgrading to 9.x is tracked separately.
    { id = "RUSTSEC-2026-0367", reason = "only ZipArchive::extract is affected; the .fform reader never extracts to disk" },
    { id = "RUSTSEC-2026-0368", reason = "only ZipArchive::extract is affected; the .fform reader never extracts to disk" },
    { id = "RUSTSEC-2026-0369", reason = "only extract() is affected; the .fform reader never extracts to disk" },
]
