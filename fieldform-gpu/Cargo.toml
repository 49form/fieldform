[package]
name = "fieldform-gpu"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"
authors = ["49form"]
repository = "https://github.com/49form/fieldform"
publish = false

[dependencies]
fieldform-field.workspace = true
fieldform-scene.workspace = true
nalgebra.workspace = true
rayon.workspace = true
thiserror.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
naga.workspace = true
pollster.workspace = true
half.workspace = true

[features]
# Counts steps per ray and dumps the generated source, on demand. Off by default, and with it
# off nothing here is compiled: a release frame is byte for byte what it was.
march-stats = []

[dev-dependencies]
# For examples that measure a real document rather than a synthetic one.
fieldform-io.workspace = true
fieldform-cage.workspace = true
serde_json.workspace = true
image.workspace = true
